<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="renderer" content="webkit">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <title><%= webpackConfig.name %></title>
    <!--[if lt IE 11]><script>window.location.href='/html/ie.html';</script><![endif]-->
    <script src="https://dr.fvcpc.cn/prod-api/static/JS-CDN/three/build/three.min.js"></script>
    <script src="https://dr.fvcpc.cn/prod-api/static/JS-CDN/three/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://dr.fvcpc.cn/prod-api/static/JS-CDN/three/examples/js/loaders/RGBELoader.js"></script>
    <script src="https://dr.fvcpc.cn/prod-api/static/JS-CDN/three/examples/js/controls/OrbitControls.js"></script>
    <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    
    /* 简化加载器样式 */
    #loader-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 999999;
      background: #181818;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
    }
    
    /* 使用CSS变量便于修改 */
    :root {
      --loader-color: #FFF;
      --loader-size: 80px;
      --loader-speed: 1.5s;
    }
    
    /* 简化加载动画 */
    .loader {
      width: var(--loader-size);
      height: var(--loader-size);
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      border-top-color: var(--loader-color);
      animation: spin var(--loader-speed) linear infinite;
      position: relative;
      margin-bottom: 20px;
    }
    
    /* 添加进度百分比 */
    .loader-progress {
      color: var(--loader-color);
      font-size: 14px;
      margin-top: 10px;
    }
    
    /* 优化标题样式 */
    .load-title {
      font-family: 'Open Sans', sans-serif;
      color: var(--loader-color);
      font-size: 1.2rem;
      margin-top: 20px;
      text-align: center;
      max-width: 80%;
      line-height: 1.5;
    }
    
    .load-title span {
      display: block;
      font-weight: normal;
      font-style: italic;
      font-size: 0.9rem;
      opacity: 0.8;
      margin-top: 5px;
    }
    
    /* 优化动画性能 */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* 加载完成状态 */
    .loaded #loader-wrapper {
      opacity: 0;
      visibility: hidden;
    }
    
    /* 响应式调整 */
    @media (max-width: 768px) {
      :root {
        --loader-size: 60px;
      }
      
      .load-title {
        font-size: 1rem;
      }
      
      .load-title span {
        font-size: 0.8rem;
      }
    }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="loader-wrapper">
        <div class="loader"></div>
        <div class="loader-progress">0%</div>
        <div class="load-title">
          正在加载系统资源
          <!-- <span>请耐心等待...</span> -->
        </div>
      </div>
    </div>
    
    <script>
      // 添加简单的加载进度模拟
      document.addEventListener('DOMContentLoaded', function() {
        const loader = document.querySelector('.loader');
        const progressElement = document.querySelector('.loader-progress');
        let progress = 0;
        
        // 模拟加载进度
        const interval = setInterval(() => {
          progress += Math.random() * 10;
          if (progress >= 100) {
            progress = 100;
            clearInterval(interval);
            
            // 加载完成后添加loaded类
            setTimeout(() => {
              document.body.classList.add('loaded');
            }, 500);
          }
          
          progressElement.textContent = Math.min(progress, 100) + '%';
        }, 300);
        
        // 如果页面完全加载完成但进度还没到100%，直接完成
        window.addEventListener('load', function() {
          progressElement.textContent = '100%';
          clearInterval(interval);
          setTimeout(() => {
            document.body.classList.add('loaded');
          }, 1000);
        });
      });
    </script>
  </body>
</html>
